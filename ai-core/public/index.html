<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Nexus Core - Dual App Interface</title>
    <style>
        body { margin: 0; background: #0f111a; color: #fff; font-family: monospace; display: flex; height: 100vh; overflow: hidden; }
        
        /* Painel Esquerdo: Controles e Chat da IA */
        #control-panel { width: 40%; background: #131622; border-right: 1px solid #2a2f45; display: flex; flex-direction: column; padding: 20px; box-sizing: border-box; }
        #control-panel h2 { color: #00ffcc; margin-top: 0; }
        #chat-box { flex: 1; background: #0b0d14; border: 1px solid #2a2f45; border-radius: 6px; padding: 10px; overflow-y: auto; margin-bottom: 15px; font-size: 14px; }
        .input-group { display: flex; gap: 10px; }
        input[type="text"] { flex: 1; background: #1a1e2e; border: 1px solid #3a4163; color: #fff; padding: 10px; border-radius: 4px; }
        button { background: #00ffcc; color: #0b0d14; border: none; padding: 10px 15px; font-weight: bold; border-radius: 4px; cursor: pointer; }
        button:hover { background: #00b38f; }

        /* Painel Direito: O Dual App (Onde o jogo roda leve e isolado) */
        #dual-app-container { width: 60%; display: flex; flex-direction: column; background: #090b10; }
        #dual-header { background: #131622; padding: 10px 20px; border-bottom: 1px solid #2a2f45; display: flex; justify-content: space-between; align-items: center; }
        #dual-viewport { flex: 1; position: relative; width: 100%; height: 100%; }
        iframe { width: 100%; height: 100%; border: none; background: #000; }
    </style>
</head>
<body>

    <!-- PAINEL DE CONTROLE (IA + COMANDOS) -->
    <div id="control-panel">
        <h2>Nexus // Dual App</h2>
        <div id="chat-box">
            <div>[Sistema]: Núcleo seguro online e pronto. Digite um comando abaixo (ex: "Crie um jogo estilo arcade e rode no Dual App").</div>
        </div>
        <div class="input-group">
            <input type="text" id="user-input" placeholder="Digite seu comando ou pedido de jogo...">
            <button onclick="enviarComando()">Executar</button>
        </div>
    </div>

    <!-- PAINEL DUAL APP (JOGOS E SIMULAÇÕES) -->
    <div id="dual-app-container">
        <div id="dual-header">
            <span id="app-status">Status: Aguardando Aplicação...</span>
            <span style="font-size: 12px; color: #00ffcc;">Modo Privado & Stealth Ativo</span>
        </div>
        <div id="dual-viewport">
            <!-- Sandbox isolado: roda o jogo sem usar a CPU/GPU do seu notebook -->
            <iframe id="game-sandbox" sandbox="allow-scripts"></iframe>
        </div>
    </div>

    <script>
        async function enviarComando() {
            const input = document.getElementById('user-input');
            const chatBox = document.getElementById('chat-box');
            const texto = input.value.trim();
            if(!texto) return;

            chatBox.innerHTML += `<div><b>Você:</b> ${texto}</div>`;
            input.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                // Envia o comando para o servidor Node.js
                const response = await fetch('/api/process-signal', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: texto, use_search: true })
                });
                const data = await response.json();
                
                chatBox.innerHTML += `<div><b>Nexus:</b> ${data.thought || 'Processado com sucesso.'}</div>`;
                
                // Se a IA gerou um código de jogo, injeta de forma privada no Dual App
                if(data.game_code) {
                    carregarNoDualApp(data.game_code);
                }
            } catch (err) {
                chatBox.innerHTML += `<div style="color: red;">[Erro]: Falha ao comunicar com o núcleo.</div>`;
            }
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function carregarNoDualApp(codigoHtml) {
            const iframe = document.getElementById('game-sandbox');
            // Cria um Blob temporário (privado, sem deixar vestígios no disco do notebook)
            const blob = new Blob([codigoHtml], { type: 'text/html' });
            iframe.src = URL.createObjectURL(blob);
            document.getElementById('app-status').innerText = 'Status: Jogo Rodando no Dual App (Isolado)';
        }
    </script>
</body>
</html>
