<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Core AI</title>
    <style>
        body { margin: 0; background: #050508; color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; height: 100vh; overflow: hidden; }
        #ai-panel { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; border-right: 1px solid #1a1a2e; position: relative; }
        #sandbox-panel { flex: 1; background: #0a0a10; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .avatar-box { width: 200px; height: 200px; border-radius: 50%; border: 3px solid #00f3ff; box-shadow: 0 0 30px #00f3ff; display: flex; align-items: center; justify-content: center; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { box-shadow: 0 0 15px #00f3ff; } 50% { box-shadow: 0 0 35px #00f3ff; } 100% { box-shadow: 0 0 15px #00f3ff; } }
        #status-text { margin-top: 20px; font-size: 1.2rem; color: #00f3ff; text-transform: uppercase; letter-spacing: 2px; }
        #output-text { margin: 15px; text-align: center; max-width: 80%; font-size: 1rem; color: #ccc; }
        iframe { width: 100%; height: 100%; border: none; }
        .btn-talk { background: #00f3ff; color: #000; font-weight: bold; padding: 12px 24px; border: none; border-radius: 5px; cursor: pointer; margin-top: 15px; }
    </style>
</head>
<body>

    <div id="ai-panel">
        <div class="avatar-box">
            <h1 style="color:#00f3ff; font-family: monospace;">NEXUS</h1>
        </div>
        <div id="status-text">Aguardando comando...</div>
        <div id="output-text">Diga "Nexus" seguido do seu pedido (ex: "Nexus cria um jogo").</div>
        <button class="btn-talk" onclick="iniciarVoz()">Ativar Escuta Continua</button>
    </div>

    <div id="sandbox-panel">
        <iframe id="game-frame" srcdoc="<h2 style='color:#555; text-align:center; margin-top:40%; font-family:sans-serif;'>Painel Sandbox / Jogos</h2>"></iframe>
    </div>

    <script>
        const RENDER_URL = 'https://nexus-ia-syc5.onrender.com';
        const statusText = document.getElementById('status-text');
        const outputText = document.getElementById('output-text');
        const gameFrame = document.getElementById('game-frame');

        // Configuração de Sintese de Voz (Falar)
        function falar(texto) {
            const synth = window.speechSynthesis;
            const utterThis = new SpeechSynthesisUtterance(texto);
            utterThis.lang = 'pt-BR';
            synth.speak(utterThis);
        }

        // Reconhecimento de Voz (Ouvir)
        window.SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        
        if (window.SpeechRecognition) {
            const recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.lang = 'pt-BR';
            recognition.interimResults = false;

            recognition.onresult = async (event) => {
                const lastResultIndex = event.results.length - 1;
                const textoOuvido = event.results[lastResultIndex][0].transcript.trim();
                console.log("Ouvido:", textoOuvido);

                // Verifica se a palavra de ativação "Nexus" foi dita
                if (textoOuvido.toLowerCase().includes("nexus")) {
                    statusText.innerText = "Processando comando...";
                    outputText.innerText = `Você disse: "${textoOuvido}"`;

                    try {
                        const response = await fetch(`${RENDER_URL}/api/chat`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ prompt: textoOuvido })
                        });

                        const data = await response.json();

                        if (data.resposta) {
                            statusText.innerText = "SISTEMA ONLINE";
                            outputText.innerText = data.resposta;
                            falar(data.resposta);
                        }

                        if (data.jogo) {
                            gameFrame.srcdoc = data.jogo;
                        }
                    } catch (err) {
                        console.error(err);
                        statusText.innerText = "Erro de Conexão";
                        outputText.innerText = "Não foi possível conectar ao servidor no Render.";
                    }
                }
            };

            recognition.onend = () => {
                recognition.start(); // Mantém o microfone sempre ativo
            };

            function iniciarVoz() {
                recognition.start();
                statusText.innerText = "Escutando... Fale 'Nexus'";
            }
        } else {
            alert("O seu navegador não suporta reconhecimento de voz.");
        }
    </script>
</body>
</html>
