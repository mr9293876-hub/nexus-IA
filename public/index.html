<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Core</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: #000000; color: #fff; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        .workspace { display: flex; flex: 1; position: relative; overflow: hidden; }

        .sphere-container { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; }
        canvas#particleCanvas { position: absolute; width: 100%; height: 100%; z-index: 1; pointer-events: none; }

        .status-box { z-index: 2; position: absolute; bottom: 2.5rem; background: rgba(5, 5, 5, 0.85); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.15); padding: 0.9rem 1.8rem; border-radius: 30px; font-size: 0.95rem; color: #ffffff; text-align: center; max-width: 85%; box-shadow: 0 8px 32px rgba(0,0,0,0.8); }

        /* Painel Dual App Otimizado e Completo */
        .dual-panel { width: 0px; opacity: 0; background: #020408; border-left: 1px solid rgba(255,255,255,0.15); transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1); display: flex; flex-direction: column; z-index: 10; overflow: hidden; box-shadow: -10px 0 30px rgba(0,0,0,0.8); }
        .dual-panel.active { width: 60vw; opacity: 1; }
        .panel-body { flex: 1; display: flex; flex-direction: column; position: relative; height: 100%; }
        .close-btn { position: absolute; top: 15px; right: 20px; z-index: 15; background: rgba(255,255,255,0.15); color: #fff; border: none; padding: 6px 14px; border-radius: 8px; cursor: pointer; font-size: 0.85rem; font-weight: bold; }
        .close-btn:hover { background: rgba(255,255,255,0.3); }
        iframe, .view-frame { width: 100%; flex: 1; border: none; background: #000; height: 100%; }

        /* Histórico Estilo WhatsApp */
        .chat-log { display: flex; flex-direction: column; gap: 0.8rem; padding: 3rem 2rem 2rem 2rem; overflow-y: auto; height: 100%; }
        .chat-bubble { padding: 0.8rem 1rem; border-radius: 12px; max-width: 80%; font-size: 0.95rem; line-height: 1.4; }
        .chat-bubble.user { background: #005c4b; align-self: flex-end; color: #fff; }
        .chat-bubble.ai { background: #202c33; align-self: flex-start; color: #e9edef; border: 1px solid rgba(255,255,255,0.05); }

        /* Teclado Adaptativo Flutuante */
        .adaptive-keyboard { position: absolute; bottom: -200px; left: 0; width: 100%; background: rgba(10,10,10,0.98); border-top: 1px solid rgba(255,255,255,0.2); padding: 1rem; transition: bottom 0.3s ease; z-index: 20; display: flex; gap: 0.5rem; }
        .adaptive-keyboard.active { bottom: 0; }
        .adaptive-keyboard input { flex: 1; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.2); padding: 0.8rem; border-radius: 8px; color: #fff; font-size: 1rem; outline: none; }
        .adaptive-keyboard button { background: #ffffff; color: #000; border: none; padding: 0 1.5rem; border-radius: 8px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div class="workspace">
        <!-- Esfera 3D de 2000 Partículas Brancas -->
        <div class="sphere-container">
            <canvas id="particleCanvas"></canvas>
            <div id="statusText" class="status-box">Diga "Nexus" seguido do seu comando...</div>
        </div>

        <!-- Painel Dual App Otimizado -->
        <div id="dualPanel" class="dual-panel">
            <div class="panel-body" id="panelBody">
                <button class="close-btn" onclick="closePanel()">✕ Fechar</button>
            </div>
        </div>
    </div>

    <!-- Teclado Adaptativo -->
    <div id="adaptiveKeyboard" class="adaptive-keyboard">
        <input type="text" id="manualInput" placeholder="Digite seu comando...">
        <button onclick="sendManual()">Enviar</button>
    </div>

    <script>
        // Voz Ultron (Calma, profunda e calculista)
        let ultronVoice = null;
        function loadVoices() {
            const voices = window.speechSynthesis.getVoices();
            ultronVoice = voices.find(v => v.lang.includes('pt') && (v.name.toLowerCase().includes('google português') || v.name.toLowerCase().includes('lucas') || v.name.toLowerCase().includes('daniel'))) || voices.find(v => v.lang.includes('pt')) || voices[0];
        }
        window.speechSynthesis.onvoiceschanged = loadVoices;
        loadVoices();

        function speak(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                if (ultronVoice) utterance.voice = ultronVoice;
                utterance.lang = 'pt-BR';
                utterance.pitch = 0.75;
                utterance.rate = 0.95;
                window.speechSynthesis.speak(utterance);
            }
        }

        // Esfera 3D de 2000 Partículas Brancas Otimizadas
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        function resize() {
            width = canvas.width = canvas.parentElement.clientWidth;
            height = canvas.height = canvas.parentElement.clientHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        const numParticles = 2000;
        const particles = [];
        let sphereRadius = 140;
        let rotationAngle = 0;
        let isSpeakingOrListening = false;

        for (let i = 0; i < numParticles; i++) {
            const theta = Math.acos(Math.random() * 2 - 1);
            const phi = Math.random() * Math.PI * 2;
            particles.push({
                ox: sphereRadius * Math.sin(theta) * Math.cos(phi),
                oy: sphereRadius * Math.sin(theta) * Math.sin(phi),
                oz: sphereRadius * Math.cos(theta),
                size: Math.random() * 1.4 + 0.5
            });
        }

        function renderParticles() {
            ctx.clearRect(0, 0, width, height);
            const cx = width / 2;
            const cy = height / 2;
            
            rotationAngle += isSpeakingOrListening ? 0.035 : 0.005;
            let currentRadius = sphereRadius + (isSpeakingOrListening ? Math.sin(Date.now() * 0.012) * 35 : 0);

            particles.forEach(p => {
                let x = p.ox * (currentRadius / sphereRadius);
                let y = p.oy * (currentRadius / sphereRadius);
                let z = p.oz * (currentRadius / sphereRadius);

                let cos = Math.cos(rotationAngle), sin = Math.sin(rotationAngle);
                let x1 = x * cos - z * sin;
                let z1 = z * cos + x * sin;

                let fov = 380;
                let scale = fov / (fov + z1);
                let px = x1 * scale + cx;
                let py = y * scale + cy;

                let alpha = (z1 + sphereRadius) / (sphereRadius * 2);
                alpha = Math.max(0.15, alpha * (isSpeakingOrListening ? 0.95 : 0.5));

                ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
                ctx.fillRect(px, py, p.size * scale, p.size * scale);
            });
            requestAnimationFrame(renderParticles);
        }
        renderParticles();

        // Escuta Contínua com Wake Word "Nexus"
        let chatHistory = [];
        const statusText = document.getElementById("statusText");

        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            const recognition = new SpeechRecognition();
            recognition.lang = 'pt-BR';
            recognition.continuous = true;
            recognition.interimResults = false;

            recognition.onresult = async (event) => {
                const transcript = event.results[event.results.length - 1][0].transcript.trim();
                console.log("Ouviu:", transcript);

                // Requer a wake word "Nexus" para acionar
                if (transcript.toLowerCase().includes('nexus')) {
                    statusText.innerText = `Comando: "${transcript}"`;
                    addChat(transcript, 'user');
                    await processCommand(transcript);
                }
            };

            recognition.onend = () => {
                try { recognition.start(); } catch (e) {}
            };

            try { recognition.start(); } catch (e) { console.log("Mic ativo"); }
        }

        function addChat(text, sender) {
            chatHistory.push({ text, sender });
        }

        async function processCommand(cmd) {
            isSpeakingOrListening = true;
            try {
                const res = await fetch('/api/assistant/command', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ command: cmd })
                });
                const data = await res.json();
                
                if (data.status === 'success') {
                    statusText.innerText = data.response;
                    speak(data.response);
                    addChat(data.response, 'ai');
                    handleActions(data.action_required, data.data);
                }
            } catch (err) {
                statusText.innerText = "Erro de conexão.";
            } finally {
                setTimeout(() => { isSpeakingOrListening = false; }, 3500);
            }
        }

        function handleActions(action, data) {
            const panel = document.getElementById("dualPanel");
            const body = document.getElementById("panelBody");
            const keyboard = document.getElementById("adaptiveKeyboard");

            keyboard.classList.remove('active');

            if (action === 'open_dual_app_game' || action === 'open_browser') {
                panel.classList.add("active");
                body.innerHTML = `<button class="close-btn" onclick="closePanel()">✕ Fechar</button><iframe class="view-frame" srcdoc="${data.replace(/"/g, '&quot;')}"></iframe>`;
            } 
            else if (action === 'open_keyboard') {
                keyboard.classList.add("active");
                document.getElementById('manualInput').focus();
            }
            else if (action === 'open_history') {
                panel.classList.add("active");
                let html = '<button class="close-btn" onclick="closePanel()">✕ Fechar</button><div class="chat-log">';
                chatHistory.forEach(c => {
                    html += `<div class="chat-bubble ${c.sender}">${c.text}</div>`;
                });
                html += '</div>';
                body.innerHTML = html;
            }
        }

        function closePanel() {
            document.getElementById("dualPanel").classList.remove("active");
        }

        function sendManual() {
            const val = document.getElementById('manualInput').value;
            if(val) {
                addChat(val, 'user');
                processCommand("Nexus " + val);
                document.getElementById('manualInput').value = '';
            }
        }
    </script>
</body>
</html>
