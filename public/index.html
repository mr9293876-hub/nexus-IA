<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Core Engine</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; background: #000; overflow: hidden; font-family: monospace; }

        /* Esfera 3D ocupa o ecrã inteiro perfeitamente ao centro */
        #main-container { width: 100%; height: 100%; position: relative; display: flex; align-items: center; justify-content: center; background: #000; }
        canvas { display: block; width: 100%; height: 100%; position: absolute; top: 0; left: 0; }

        /* Painel Dual Fullscreen (inicialmente oculto) */
        #dual-fullscreen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #010108; z-index: 100; display: none; flex-direction: column; }
        iframe { width: 100%; height: 100%; border: none; background: #000; }

        /* Botões de Acesso Rápido na Tela Inicial */
        #hud-controls { position: absolute; bottom: 25px; left: 50%; transform: translateX(-50%); display: flex; gap: 15px; z-index: 10; }
        .hud-btn { background: rgba(0, 243, 255, 0.1); border: 1px solid #00f3ff; color: #00f3ff; padding: 10px 18px; font-size: 12px; cursor: pointer; letter-spacing: 1px; transition: 0.3s; }
        .hud-btn:hover { background: #00f3ff; color: #000; box-shadow: 0 0 15px rgba(0,243,255,0.6); }

        /* Teclado Virtual Oculto */
        #virtual-keyboard { position: absolute; bottom: 80px; left: 50%; transform: translateX(-50%); background: rgba(5,5,15,0.95); border: 1px solid #00f3ff; padding: 10px; display: none; z-index: 20; }
        #virtual-keyboard input { background: #000; border: 1px solid #00f3ff; color: #00f3ff; padding: 8px; width: 250px; font-family: monospace; }
    </style>
</head>
<body>

    <!-- ECRÃ PRINCIPAL COM A BOLA 3D CENTRADA -->
    <div id="main-container">
        <canvas id="nexusCanvas"></canvas>
        
        <!-- Botões de Acesso Rápido na Tela Inicial -->
        <div id="hud-controls">
            <button class="hud-btn" onclick="toggleKeyboard()">[ TECLADO ]</button>
            <button class="hud-btn" onclick="executarComandoManual('Nexus conectar Instagram')">[ INSTAGRAM ]</button>
            <button class="hud-btn" onclick="executarComandoManual('Nexus criar jogo')">[ MODO DUAL ]</button>
        </div>

        <!-- Teclado Virtual Integrado -->
        <div id="virtual-keyboard">
            <input type="text" id="manualInput" placeholder="Digite comando para o Nexus..." onkeypress="handleKey(event)">
        </div>
    </div>

    <!-- ECRÃ DUAL FULLSCREEN (Cobre tudo sem apagar a bola por trás) -->
    <div id="dual-fullscreen">
        <iframe id="dualFrame"></iframe>
    </div>

    <script>
        const CLOUD_URL = 'https://nexus-ia-syc5.onrender.com';

        // --- ESFERA 3D (3000 PONTOS) ---
        const canvas = document.getElementById('nexusCanvas');
        const ctx = canvas.getContext('2d');
        let width, height;

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        const numPoints = 3000;
        const points = [];
        const radius = 180;

        for (let i = 0; i < numPoints; i++) {
            const phi = Math.acos(-1 + (2 * i) / numPoints);
            const theta = Math.sqrt(numPoints * Math.PI) * phi;
            points.push({
                x: radius * Math.cos(theta) * Math.sin(phi),
                y: radius * Math.sin(theta) * Math.sin(phi),
                z: radius * Math.cos(phi)
            });
        }

        let angleX = 0, angleY = 0;
        let speed = 1;
        let ballState = "idle";

        function animate() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.25)';
            ctx.fillRect(0, 0, width, height);

            const cx = width / 2;
            const cy = height / 2;

            if (ballState === "listening") speed = 3.5;
            else if (ballState === "speaking") speed = 2.2;
            else speed = 1;

            angleX += 0.004 * speed;
            angleY += 0.007 * speed;

            const cosX = Math.cos(angleX), sinX = Math.sin(angleX);
            const cosY = Math.cos(angleY), sinY = Math.sin(angleY);

            for (let i = 0; i < points.length; i++) {
                let p = points[i];
                let x1 = p.x * cosY - p.z * sinY;
                let z1 = p.z * cosY + p.x * sinY;
                let y2 = p.y * cosX - z1 * sinX;
                let z2 = z1 * cosX + p.y * sinX;

                let fov = 400;
                let scale = fov / (fov + z2);
                let px = x1 * scale + cx;
                let py = y2 * scale + cy;

                if (z2 > -fov) {
                    let alpha = (z2 + radius) / (2 * radius);
                    alpha = Math.max(0.1, Math.min(1, alpha));
                    ctx.fillStyle = ballState === "listening" ? `rgba(0, 243, 255, ${alpha})` : `rgba(255, 255, 255, ${alpha})`;
                    ctx.fillRect(px, py, scale * 1.5, scale * 1.5);
                }
            }
            requestAnimationFrame(animate);
        }
        animate();

        // --- VOZ MASCULINA ---
        function falarVozMasculina(texto) {
            const synth = window.speechSynthesis;
            const utter = new SpeechSynthesisUtterance(texto);
            utter.lang = 'pt-BR';

            const voices = synth.getVoices();
            const vozMasculina = voices.find(v => v.lang.includes('pt') && (v.name.toLowerCase().includes('male') || v.name.toLowerCase().includes('ricardo') || v.name.toLowerCase().includes('daniel') || v.name.toLowerCase().includes('antonio')));
            if (vozMasculina) utter.voice = vozMasculina;

            utter.onstart = () => { ballState = "speaking"; };
            utter.onend = () => { ballState = "idle"; };

            synth.speak(utter);
        }

        // --- CONTROLAR O ECRÃ DUAL ---
        function abrirDual(conteudoHtml) {
            document.getElementById('dualFrame').srcdoc = conteudoHtml;
            document.getElementById('dual-fullscreen').style.display = 'flex';
        }

        function fecharDual() {
            document.getElementById('dual-fullscreen').style.display = 'none';
        }

        function toggleKeyboard() {
            const kb = document.getElementById('virtual-keyboard');
            kb.style.display = kb.style.display === 'block' ? 'none' : 'block';
            if(kb.style.display === 'block') document.getElementById('manualInput').focus();
        }

        function handleKey(e) {
            if(e.key === 'Enter') {
                executarComandoManual(e.target.value);
                e.target.value = '';
                toggleKeyboard();
            }
        }

        // --- COMUNICAÇÃO COM A NUVEM ---
        async function enviarComando(frase) {
            ballState = "listening";
            try {
                const res = await fetch(`${CLOUD_URL}/api/nexus`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: frase })
                });
                const dados = await res.json();

                if (dados.resposta) falarVozMasculina(dados.resposta);

                if (dados.action === "keyboard") {
                    toggleKeyboard();
                } else if (dados.action === "dual_fullscreen" && dados.painel) {
                    abrirDual(dados.painel);
                }
            } catch (e) {
                ballState = "idle";
                console.error("Erro:", e);
            }
        }

        function executarComandoManual(texto) {
            enviarComando(texto);
        }

        // --- RECONHECIMENTO DE VOZ RIGOROSO (Exige a palavra 'Nexus') ---
        window.SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

        if (window.SpeechRecognition) {
            const recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = false;
            recognition.lang = 'pt-BR';

            recognition.onresult = (event) => {
                const ultimo = event.results.length - 1;
                const frase = event.results[ultimo][0].transcript.trim();

                // Regra estricta: só aciona se disser a palavra 'nexus'
                if (frase.toLowerCase().includes("nexus")) {
                    enviarComando(frase);
                }
            };

            recognition.onend = () => { recognition.start(); };

            window.addEventListener('load', () => {
                window.speechSynthesis.getVoices();
                recognition.start();
            });
        }
    </script>
</body>
</html>
