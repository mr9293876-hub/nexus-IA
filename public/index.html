<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Core</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; background: #000; overflow: hidden; display: flex; }

        /* DUAL INTERFACE: Ocupa a tela toda dividida em dois lados perfeitos */
        #left-screen { flex: 1; height: 100%; position: relative; background: #000; }
        #right-screen { flex: 1; height: 100%; background: #020205; position: relative; border-left: 1px solid #111; }

        /* Canvas da Esfera 3D de 3000 pontos */
        canvas { display: block; width: 100%; height: 100%; position: absolute; top: 0; left: 0; }

        /* Sandbox / Segunda Interface para Jogos, NPC e IA */
        iframe { width: 100%; height: 100%; border: none; background: #000; }
    </style>
</head>
<body>

    <!-- LADO ESQUERDO: A Esfera 3D de 3000 pontos e a Escuta de Voz em 2º plano -->
    <div id="left-screen">
        <canvas id="nexusCanvas"></canvas>
    </div>

    <!-- LADO DIREITO: A Segunda Interface (Painel de Jogos / NPC / IA Correctora) -->
    <div id="right-screen">
        <iframe id="sandboxFrame" srcdoc="<h3 style='color:#222; text-align:center; margin-top:45%; font-family:monospace;'>[ N E X U S - S A N D B O X ]</h3>"></iframe>
    </div>

    <script>
        const RENDER_URL = 'https://nexus-ia-syc5.onrender.com';

        // --- ANIMAÇÃO DA ESFERA 3D (3000 PONTOS) ---
        const canvas = document.getElementById('nexusCanvas');
        const ctx = canvas.getContext('2d');
        let width, height;

        function resize() {
            width = canvas.width = canvas.parentElement.clientWidth;
            height = canvas.height = canvas.parentElement.clientHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        const numPoints = 3000;
        const points = [];
        const radius = 170;

        for (let i = 0; i < numPoints; i++) {
            const phi = Math.acos(-1 + (2 * i) / numPoints);
            const theta = Math.sqrt(numPoints * Math.PI) * phi;
            points.push({
                x: radius * Math.cos(theta) * Math.sin(phi),
                y: radius * Math.sin(theta) * Math.sin(phi),
                z: radius * Math.cos(phi)
            });
        }

        let angleX = 0, angleY = 0;
        let speed = 1;
        let ballState = "idle"; // idle, listening, speaking

        function animate() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.25)';
            ctx.fillRect(0, 0, width, height);

            const cx = width / 2;
            const cy = height / 2;

            // Reatividade visual da bola ao falar ou ouvir
            if (ballState === "listening") speed = 3.5;
            else if (ballState === "speaking") speed = 2.2;
            else speed = 1;

            angleX += 0.004 * speed;
            angleY += 0.007 * speed;

            const cosX = Math.cos(angleX), sinX = Math.sin(angleX);
            const cosY = Math.cos(angleY), sinY = Math.sin(angleY);

            for (let i = 0; i < points.length; i++) {
                let p = points[i];
                let x1 = p.x * cosY - p.z * sinY;
                let z1 = p.z * cosY + p.x * sinY;
                let y2 = p.y * cosX - z1 * sinX;
                let z2 = z1 * cosX + p.y * sinX;

                let fov = 400;
                let scale = fov / (fov + z2);
                let px = x1 * scale + cx;
                let py = y2 * scale + cy;

                if (z2 > -fov) {
                    let alpha = (z2 + radius) / (2 * radius);
                    alpha = Math.max(0.1, Math.min(1, alpha));
                    
                    // Fica azul quando ouve, branco normal no resto
                    ctx.fillStyle = ballState === "listening" ? `rgba(0, 243, 255, ${alpha})` : `rgba(255, 255, 255, ${alpha})`;
                    ctx.fillRect(px, py, scale * 1.5, scale * 1.5);
                }
            }
            requestAnimationFrame(animate);
        }
        animate();

        // --- SISTEMA DE VOZ MASCULINA ---
        function falarVozMasculina(texto) {
            const synth = window.speechSynthesis;
            const utter = new SpeechSynthesisUtterance(texto);
            utter.lang = 'pt-BR';

            const voices = synth.getVoices();
            const vozMasculina = voices.find(v => v.lang.includes('pt') && (v.name.toLowerCase().includes('male') || v.name.toLowerCase().includes('ricardo') || v.name.toLowerCase().includes('daniel') || v.name.toLowerCase().includes('antonio')));
            if (vozMasculina) utter.voice = vozMasculina;

            utter.onstart = () => { ballState = "speaking"; };
            utter.onend = () => { ballState = "idle"; };

            synth.speak(utter);
        }

        // --- RECONHECIMENTO DE VOZ EM 2º PLANO (SÓ PROCESSA APÓS PARAR DE FALAR) ---
        window.SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

        if (window.SpeechRecognition) {
            const recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = false; // Aguarda o utilizador terminar a frase toda
            recognition.lang = 'pt-BR';

            recognition.onresult = async (event) => {
                const ultimo = event.results.length - 1;
                const frase = event.results[ultimo][0].transcript.trim();

                // Só ativa se disser a palavra "Nexus"
                if (frase.toLowerCase().includes("nexus")) {
                    ballState = "listening";

                    try {
                        const respostaServidor = await fetch(`${RENDER_URL}/api/chat`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ prompt: frase })
                        });
                        const dados = await respostaServidor.json();

                        if (dados.resposta) {
                            falarVozMasculina(dados.resposta);
                        }
                        if (dados.jogo) {
                            document.getElementById('sandboxFrame').srcdoc = dados.jogo;
                        }
                    } catch (e) {
                        ballState = "idle";
                    }
                }
            };

            recognition.onend = () => {
                recognition.start(); // Mantém a escuta em segundo plano permanentemente
            };

            // Inicia automaticamente a escuta mal a página carrega
            window.addEventListener('load', () => {
                window.speechSynthesis.getVoices();
                recognition.start();
            });
        }
    </script>
</body>
</html>
