<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus-IA - Core</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #000000;
            overflow: hidden;
            font-family: monospace;
            color: #ffffff;
        }
        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        #ui-layer {
            position: relative;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100%;
            padding: 20px;
        }
        .status-box {
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid #333;
            padding: 10px 20px;
            border-radius: 4px;
            font-size: 14px;
            letter-spacing: 1px;
            width: fit-content;
        }
        .error-msg {
            color: #ff3333;
        }
    </style>
</head>
<body>

    <!-- Canvas onde corre a esfera 3D de pontos -->
    <canvas id="nexusCanvas"></canvas>

    <!-- Camada da tua interface original -->
    <div id="ui-layer">
        <div class="status-box" id="status">
            NEXUS CORE // SISTEMA ONLINE
        </div>
        <div class="status-box error-msg" id="error-box" style="display:none;">
            Erro de conexão.
        </div>
    </div>

    <script>
        const RENDER_URL = 'https://nexus-ia-syc5.onrender.com';
        
        // --- ANIMAÇÃO DA ESFERA 3D (Aprox. 3000 pontos em rotação) ---
        const canvas = document.getElementById('nexusCanvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // Gerar os pontos da esfera (cerca de 3000 pontos)
        const numPoints = 3000;
        const points = [];
        const radius = 180; // Raio da esfera

        for (let i = 0; i < numPoints; i++) {
            // Distribuição matemática uniforme na esfera (Fibonacci sphere ou distribuição esférica)
            const phi = Math.acos(-1 + (2 * i) / numPoints);
            const theta = Math.sqrt(numPoints * Math.PI) * phi;

            const x = radius * Math.cos(theta) * Math.sin(phi);
            const y = radius * Math.sin(theta) * Math.sin(phi);
            const z = radius * Math.cos(phi);

            points.push({ x, y, z });
        }

        let angleX = 0;
        let angleY = 0;

        function animate() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.2)'; // Efeito de rasto suave
            ctx.fillRect(0, 0, width, height);

            const cx = width / 2;
            const cy = height / 2;

            // Rotação contínua da esfera
            angleX += 0.005;
            angleY += 0.008;

            const cosX = Math.cos(angleX);
            const sinX = Math.sin(angleX);
            const cosY = Math.cos(angleY);
            const sinY = Math.sin(angleY);

            for (let i = 0; i < points.length; i++) {
                let p = points[i];

                // Rotação no eixo Y
                let x1 = p.x * cosY - p.z * sinY;
                let z1 = p.z * cosY + p.x * sinY;

                // Rotação no eixo X
                let y2 = p.y * cosX - z1 * sinX;
                let z2 = z1 * cosX + p.y * sinX;

                // Perspetiva 3D
                let fov = 400;
                let scale = fov / (fov + z2);
                let px = x1 * scale + cx;
                let py = y2 * scale + cy;

                // Desenhar o ponto branco se estiver à frente
                if (z2 > -fov) {
                    let alpha = (z2 + radius) / (2 * radius); // Brilho baseado na profundidade
                    alpha = Math.max(0.1, Math.min(1, alpha));
                    
                    ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
                    let size = scale * 1.5;
                    ctx.fillRect(px, py, size, size);
                }
            }

            requestAnimationFrame(animate);
        }

        animate();

        // --- VERIFICAÇÃO DE CONEXÃO AO RENDER ---
        async function verificarConexao() {
            try {
                const res = await fetch(`${RENDER_URL}/api/status`);
                if (res.ok) {
                    document.getElementById('status').innerText = "NEXUS CORE // LIGADO AO RENDER";
                    document.getElementById('error-box').style.display = 'none';
                }
            } catch (e) {
                document.getElementById('error-box').style.display = 'block';
            }
        }

        verificarConexao();
    </script>
</body>
</html>
